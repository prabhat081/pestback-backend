services:
  postgres:
    image: postgres:17
    container_name: pestback-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pestback
    ports:
      - "5433:5432"
    volumes:
      - pestback_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: pestback-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - pestback_redis_data:/data

volumes:
  pestback_postgres_data:
  pestback_redis_data: